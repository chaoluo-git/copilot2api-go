services:
  copilot-go:
    build: .
    image: ghcr.io/starrykira/copilot2api-go:latest
    container_name: copilot-go
    restart: unless-stopped
    ports:
      - "3000:3000"   # Web Console
      - "4141:4141"   # Proxy
    volumes:
      - copilot-data:/root/.local/share/copilot-api
      - ./certs:/run/copilot/custom-cas:ro
    environment:
      - TZ=Asia/Shanghai

volumes:
  copilot-data:
    driver: local
